<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>

<body style="background-color: #78a392;">
    <section id="contact">

        <h2>Get in Touch</h2>

        <p>
            Have questions, suggestions or feedback?
            We would love to hear from you!
        </p>

        <table width="700" cellpadding="20" style="background-color: #F5F1E7; color: #294735;">

            <tr>
                <td>

                    <form action="#" method="post">

                        <fieldset>
                            <legend><strong>Contact Form</strong></legend>

                            <p>
                                <label for="name">Full Name:</label>
                                <br>
                                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                            </p>

                            <p>
                                <label for="email">Email Address:</label>
                                <br>
                                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                            </p>

                            <p>
                                <label for="subject">Subject:</label>
                                <br>
                                <select id="subject" name="subject">
                                    <option value="">Choose a subject</option>
                                    <option value="recipes">Recipe Suggestions</option>
                                    <option value="nutrition">Nutrition Questions</option>
                                    <option value="feedback">General Feedback</option>
                                </select>
                            </p>

                            <p>
                                <label for="message">Your Message:</label>
                                <br>
                                <textarea id="message" name="message" rows="5" cols="40"
                                    placeholder="Write your message here..." required></textarea>
                            </p>

                            <button type="submit">Send Message</button>

                        </fieldset>

                    </form>

                </td>
            </tr>

        </table>
        <p>
            <a href="healthy-bites.html" style="color: #b1dac7;">
                Back to the First Page.
            </a>
        </p>

    </section>

    <hr>
</body>

</html>
